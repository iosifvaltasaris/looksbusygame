<style>
:root{--bg:#f3f2f1;--card:#fff;--ink:#242424;--mute:#616161;--line:#e1dfdd;--acc:#0f6cbd;--accbg:#e6f0fa;--gold:#b7791f;--ok:#2f855a;--bad:#c53030;--hdr:#0f6cbd;

:root[data-theme="dark"]{--bg:#1b1a19;--card:#292827;--ink:#f3f2f1;--mute:#a19f9d;--line:#3b3a39;--acc:#6cb8f6;--accbg:#1c3550;--gold:#ecc062;--ok:#58c58a;--bad:#ef7d6e;--hdr:#0b4a82;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 "Segoe UI",system-ui,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:12px}
.app{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:12px}

.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mute{color:var(--mute);font-size:12px}
.topbar{background:var(--hdr);color:#fff;display:flex;align-items:center;gap:12px;padding:8px 14px;flex-wrap:wrap}
.logo{font-size:16px;font-weight:700;white-space:nowrap}
.search{flex:1;max-width:380px;border:0;border-radius:4px;padding:6px 10px;background:#ffffff30;color:#fff;font:inherit}.search::placeholder{color:#ffffffcc}
.sp{flex:1}.me{text-align:right;line-height:1.15;white-space:nowrap}.me b{font-size:15px}
button{font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:4px;padding:6px 12px}
button:hover:not(:disabled){border-color:var(--acc)}button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}button:disabled{opacity:.45;cursor:not-allowed}
.pri{background:var(--acc);border-color:var(--acc);color:#fff}.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.lang{display:flex}.lang button{padding:2px 8px;font-size:11px;border-radius:0;background:transparent;color:#fff;border-color:#ffffff66}.lang button:first-child{border-radius:4px 0 0 4px}.lang button:last-child{border-radius:0 4px 4px 0;border-left:0}.lang .on{background:#fff;color:#0b4a82}
.ribbon{display:flex;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pb{height:3px;background:var(--line)}.pb i{display:block;height:100%;background:var(--gold);width:0}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--gold);width:0}
.banners{padding:0 12px}.banner{border-left:4px solid var(--acc);margin:10px 0 0}#boss{border-left-color:var(--bad)}
.m3{display:grid;grid-template-columns:170px minmax(240px,1fr) 1.15fr;min-height:430px}
aside{border-right:1px solid var(--line);padding:8px}
.fo{display:flex;justify-content:space-between;padding:7px 10px;border-radius:4px}.fo.on{background:var(--accbg);color:var(--acc);font-weight:700}
.list{border-right:1px solid var(--line);max-height:580px;overflow:hidden}.lh{padding:8px 12px;border-bottom:1px solid var(--line);font-weight:700}
.mrow{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);border-left:3px solid transparent}.mrow.sel{background:var(--accbg)}.mrow.unread{border-left-color:var(--acc)}.mrow.unread .subj,.mrow.unread b{font-weight:700}.mrow.new{animation:sl .25s}
@keyframes sl{from{transform:translateY(-12px);opacity:0}}
.av{width:34px;height:34px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.mc{min-width:0;flex:1}.tp{display:flex;justify-content:space-between;gap:6px}.subj,.prev{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.prev{color:var(--mute)}
.read{padding:16px}.read h2{margin:0 0 6px;font-size:19px}.meta{display:flex;gap:10px;align-items:center;margin:8px 0}.read p{margin:10px 0}
.big{width:100%;padding:12px;font-size:16px;margin-top:8px}
.status{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:6px 12px;background:var(--bg);border-top:1px solid var(--line);font-size:12px;color:var(--mute)}
.up{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.up:first-of-type{border-top:0}
h3{margin:2px 0 8px;font-size:13px;color:var(--mute);font-weight:600}
.pop{position:fixed;pointer-events:none;font-weight:700;color:var(--acc);animation:fl .8s forwards;z-index:9}
@keyframes fl{to{transform:translateY(-55px);opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:8px 14px;border-radius:20px;z-index:99;font-weight:600;max-width:92%;text-align:center}
.coffee{background:#ffd34a;border-color:#ffd34a;color:#1a1008;padding:4px 10px}
[hidden]{display:none!important}
@media(max-width:760px){.m3{grid-template-columns:1fr}aside{display:none}.read{order:-1;border-bottom:1px solid var(--line)}.list{border-right:0}.search{display:none}}
@media (prefers-reduced-motion:reduce){.mrow.new,.pop{animation:none}}

 <div class="topbar"><span class="logo">✉ Mail</span><input class="search" id="srch" disabled><span class="sp"></span>

<script>
function $(i){return document.getElementById(i)}
const COFFEE_URL="https://buymeacoffee.com/looksbusygame"; // put your own link here
$("don").href=COFFEE_URL;$("don3").href=COFFEE_URL;
const KEY="looksbusy1";
const L={en:{sub:"The idle game for the office. Looks like work.",stats:"{0}/s · {1}/click · x{2} bonus",need:"Next promotion: {0} this run",promoNote:"Promotion resets your office for a permanent +50% bonus.",promo:"Get promoted to {0}",
boss:"👔 The boss is coming!",bossBtn:"Look busy! (Space)",bossOk:"Nice save! +{0}",bossFail:"Caught slacking! −{0}",inboxH:"Inbox",reply:"📧 Reply All",shopH:"Office upgrades",
dT:"Perfect attendance · streak {0}",dX:"Today’s bonus: {0} work units",claim:"Clock in",cT:"+{0} · streak {1}",away:"While you were at lunch you earned {0}",
share:"Copy my business card",copied:"Copied! Paste it anywhere.",card:"I’m a {0} at Looks Busy with {1} work units. Can you beat me?",
donT:"Looks Busy is free and ad-free.",donS:"If it made your day less boring, buy the developer a coffee.",donB:"☕ Buy me a coffee",loc:"en-US",
titles:["Intern","Associate","Analyst","Manager","Senior Manager","Director","VP","CEO","Chairman"],
mails:["Re: Re: Fwd: Meeting about the meeting","URGENT: Please see attached (nothing attached)","Quick question (47 recipients)","Per my last email…","Synergy workshop: mandatory fun","Friendly reminder: friendly reminder","Can we circle back on this?","Out of office until 2019"],from:"",search:"Search mail",wuL:"work units",del:"Delete",arch:"Archive",conn:"Connected to Exchange",to:"To: you, + 46 others",sig:"Regards, sent from my phone while on mute",fold:["Inbox","Drafts","Sent Items","Deleted Items","Junk Email"],senders:["HR Team","Karen (Accounting)","IT Helpdesk","Your Manager","Steve (47 recipients)","CEO Office","No-Reply","Facilities"],prev:["Please see the attached (nothing attached)…","Just circling back on this…","Reminder: mandatory fun starts at 3pm…","Hope this email finds you well…","Can you action this by EOD?","Looping in a few more people…","As discussed in the meeting about the meeting…","Kindly ignore my previous email…"],body:["Hi all, following up on the follow-up from last week’s sync. Please see below for next steps (there are none). Let me know if you have questions, or if I should schedule a call to discuss scheduling a call.","Quick reminder that the new expense policy requires a form to approve the form. The form is attached to a different email. Thanks for your cooperation.","Team, we’re excited to announce a mandatory voluntary wellness webinar. Attendance will be noted. Snacks are not provided.","Just checking if you had a chance to look at my last email. I’ve looped in everyone I can think of to increase visibility.","Per my last email, which you may not have received because I forgot to press send, please advise.","Great work everyone on the synergy this quarter. Let’s keep leveraging our learnings going forward. More soon."],
N:{kb:["Mechanical keyboard","+1 per click"],cof:["Coffee machine ☕","+1/sec"],int:["Intern 🧑‍💼","+6/sec"],mac:["Spreadsheet macro 📊","+35/sec"],met:["Meeting that could be an email 🗓","+200/sec"],ai:["AI assistant 🤖","+1,100/sec"]}},
el:{sub:"Το idle παιχνίδι για το γραφείο. Μοιάζει με δουλειά.",stats:"{0}/δ · {1}/κλικ · x{2} μπόνους",need:"Επόμενη προαγωγή: {0} σε αυτή τη φάση",promoNote:"Η προαγωγή μηδενίζει το γραφείο και δίνει μόνιμο +50% μπόνους.",promo:"Προαγωγή σε {0}",
boss:"👔 Έρχεται ο προϊστάμενος!",bossBtn:"Φαίνε απασχολημένος! (Space)",bossOk:"Σώθηκες! +{0}",bossFail:"Σε έπιασαν! −{0}",inboxH:"Εισερχόμενα",reply:"📧 Απάντηση σε όλους",shopH:"Αναβαθμίσεις γραφείου",
dT:"Τέλεια παρουσία · σερί {0}",dX:"Μπόνους σήμερα: {0} μονάδες εργασίας",claim:"Χτύπα κάρτα",cT:"+{0} · σερί {1}",away:"Όσο έλειπες για φαγητό, κέρδισες {0}",
share:"Αντίγραψε την κάρτα μου",copied:"Αντιγράφηκε! Κάνε paste όπου θες.",card:"Είμαι {0} στο Looks Busy με {1} μονάδες εργασίας. Μπορείς να με περάσεις;",
donT:"Το Looks Busy είναι δωρεάν και χωρίς διαφημίσεις.",donS:"Αν σου έκανε τη μέρα λιγότερο βαρετή, κέρνα τον developer έναν καφέ.",donB:"☕ Buy me a coffee",loc:"el-GR",
titles:["Ασκούμενος","Συνεργάτης","Αναλυτής","Μάνατζερ","Ανώτερος Μάνατζερ","Διευθυντής","Αντιπρόεδρος","CEO","Πρόεδρος ΔΣ"],
mails:["Re: Re: Fwd: Σύσκεψη για τη σύσκεψη","ΕΠΕΙΓΟΝ: Δες το συνημμένο (δεν έχει)","Μια γρήγορη ερώτηση (47 παραλήπτες)","Σύμφωνα με το προηγούμενο email μου…","Workshop συνέργειας: υποχρεωτική διασκέδαση","Φιλική υπενθύμιση: φιλική υπενθύμιση","Να το ξαναδούμε αυτό;","Εκτός γραφείου μέχρι το 2019"],from:"",search:"Αναζήτηση αλληλογραφίας",wuL:"μονάδες εργασίας",del:"Διαγραφή",arch:"Αρχειοθέτηση",conn:"Συνδεδεμένο στον Exchange",to:"Προς: εσένα, + 46 άλλους",sig:"Με εκτίμηση, στάλθηκε από το κινητό μου ενώ ήμουν σε σίγαση",fold:["Εισερχόμενα","Πρόχειρα","Απεσταλμένα","Διαγραμμένα","Ανεπιθύμητα"],senders:["Τμήμα HR","Καρολίνα (Λογιστήριο)","IT Helpdesk","Ο προϊστάμενός σου","Στέλιος (47 παραλήπτες)","Γραφείο CEO","No-Reply","Διαχείριση κτιρίου"],prev:["Δες το συνημμένο (δεν έχει συνημμένο)…","Επανέρχομαι σχετικά με αυτό…","Υπενθύμιση: η υποχρεωτική διασκέδαση ξεκινά στις 3…","Ελπίζω να σε βρίσκει καλά αυτό το email…","Μπορείς να το κλείσεις μέχρι το τέλος της ημέρας;","Βάζω κι άλλους στην κοινοποίηση…","Όπως συζητήσαμε στη σύσκεψη για τη σύσκεψη…","Αγνόησε το προηγούμενο email μου…"],body:["Γεια σε όλους, σε συνέχεια της συνέχειας της περσινής σύσκεψης. Δείτε παρακάτω τα επόμενα βήματα (δεν υπάρχουν). Πείτε μου αν έχετε απορίες ή αν να κλείσω κλήση για να κλείσουμε κλήση.","Υπενθύμιση: η νέα πολιτική εξόδων απαιτεί φόρμα για να εγκριθεί η φόρμα. Η φόρμα είναι συνημμένη σε άλλο email. Ευχαριστώ για τη συνεργασία.","Ομάδα, με χαρά ανακοινώνουμε ένα υποχρεωτικό εθελοντικό webinar ευεξίας. Η παρουσία θα καταγραφεί. Δεν προσφέρονται σνακ.","Απλώς ρωτάω αν είδες το τελευταίο μου email. Βάζω όλους όσους σκέφτηκα για να αυξηθεί η ορατότητα.","Σύμφωνα με το τελευταίο μου email, που ίσως δεν έλαβες γιατί ξέχασα να πατήσω αποστολή, παρακαλώ ενημέρωσέ με.","Μπράβο σε όλους για τη συνέργεια αυτό το τρίμηνο. Συνεχίζουμε να αξιοποιούμε όσα μάθαμε. Σύντομα νέα."],
N:{kb:["Μηχανικό πληκτρολόγιο","+1 ανά κλικ"],cof:["Καφετιέρα ☕","+1/δευτ."],int:["Ασκούμενος 🧑‍💼","+6/δευτ."],mac:["Μακροεντολή στο Excel 📊","+35/δευτ."],met:["Σύσκεψη που θα μπορούσε να είναι email 🗓","+200/δευτ."],ai:["Βοηθός AI 🤖","+1.100/δευτ."]}}};
let lang="en";try{lang=localStorage.getItem("looksbusy_lang")||"en"}catch(e){}if(!L[lang])lang="en";
const t=(k,...a)=>L[lang][k].replace(/\{(\d)\}/g,(_,i)=>a[i]);
const UP=[{id:"kb",b:25,c:1},{id:"cof",b:15,i:1},{id:"int",b:120,i:6},{id:"mac",b:900,i:35},{id:"met",b:7000,i:200},{id:"ai",b:55000,i:1100}];
const dayKey=d=>d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
const today=dayKey(new Date()),yest=dayKey(new Date(Date.now()-864e5));
let S={wu:0,total:0,run:0,rank:0,lvl:{},streak:0,lastDay:"",last:Date.now()};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
const lv=id=>S.lvl[id]||0,cost=u=>Math.ceil(u.b*1.15**lv(u.id)),mult=()=>1+.5*S.rank;
const ips=()=>UP.reduce((a,u)=>a+(u.i||0)*lv(u.id),0)*mult(),cpc=()=>(1+lv("kb"))*mult();
const need=()=>Math.round(5000*4**S.rank),title=r=>L[lang].titles[Math.min(r,8)];
const fmt=n=>n>=1e6?(n/1e6).toFixed(2)+"M":n>=1e4?(n/1e3).toFixed(1)+"K":Math.floor(n).toLocaleString(L[lang].loc);
const save=()=>{S.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const gain=n=>{S.wu+=n;S.total+=n;S.run+=n};
const away=Math.min((Date.now()-S.last)/1000,28800);let awayGain=0;if(away>5&&ips()>0){awayGain=ips()*away;gain(awayGain)}
let tt;const toast=m=>{const e=$("toast");e.textContent=m;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,2800)};
const pop=(x,y,m)=>{const p=document.createElement("div");p.className="pop";p.textContent=m;p.style.left=x+"px";p.style.top=y+"px";document.body.appendChild(p);setTimeout(()=>p.remove(),800)};

// Inbox
const rnd=n=>Math.floor(Math.random()*n),pad=n=>(n<10?"0":"")+n,COL=["#0f6cbd","#c239b3","#107c10","#d83b01","#8764b8","#038387","#986f0b"];
const mk=r=>({s:rnd(8),j:rnd(8),p:rnd(8),b:rnd(6),tm:(8+rnd(10))+":"+pad(rnd(60)),read:!!r,col:rnd(7)});
let MAILS=Array.from({length:8},(_,i)=>mk(i>0));
function drawMail(){const D=L[lang],m0=MAILS[0],n0=D.senders[m0.s];
 $("inbox").innerHTML=MAILS.map((m,i)=>{const nm=D.senders[m.s];return`<div class="mrow${i?"":" sel"}${m.read?"":" unread"}"><span class="av" style="background:${COL[m.col]}">${nm[0]}</span><div class="mc"><div class="tp"><b>${nm}</b><span class="mute">${m.tm}</span></div><div class="subj">${m.read?"↩ ":""}${D.mails[m.j]}</div><div class="prev">${D.prev[m.p]}</div></div></div>`}).join("");
 $("rp").innerHTML=`<h2>${D.mails[m0.j]}</h2><div class="meta"><span class="av" style="background:${COL[m0.col]}">${n0[0]}</span><div><b>${n0}</b><div class="mute">${D.to}</div></div></div><p>${D.body[m0.b]}</p><p class="mute">${D.sig}</p>`;
 $("folders").innerHTML=D.fold.map((f,i)=>`<div class="fo${i?"":" on"}"><span>${f}</span>${i?"":"<b>99+</b>"}</div>`).join("");$("srch").placeholder="🔍 "+D.search}
function fillInbox(){drawMail()}
function doReply(e){const v=cpc();gain(v);pop(e.clientX||innerWidth/2,e.clientY||300,"+"+fmt(v));MAILS[0].read=true;MAILS.unshift(mk(false));MAILS.length=Math.min(MAILS.length,8);drawMail();$("inbox").firstElementChild.classList.add("new")}
$("reply").onclick=doReply;$("reply2").onclick=doReply;

// Shop
function shop(){$("shop").innerHTML=`<h3>${t("shopH")}</h3>`+UP.map(u=>{const n=L[lang].N[u.id];return`<div class="up"><div><b>${n[0]}</b> <span class="mute">×${lv(u.id)}</span><div class="mute">${n[1]}</div></div><button data-id="${u.id}">${fmt(cost(u))}</button></div>`}).join("")}
$("shop").onclick=e=>{const b=e.target.closest("button");if(!b)return;const u=UP.find(x=>x.id===b.dataset.id);if(S.wu>=cost(u)){S.wu-=cost(u);S.lvl[u.id]=lv(u.id)+1;shop();save()}};

// Promotion
$("promo").onclick=()=>{if(S.run<need())return;S.rank++;S.wu=0;S.run=0;S.lvl={};shop();save();toast("🎉 "+title(S.rank))};

// Daily
const ns=S.lastDay===yest?S.streak+1:1,rw=()=>Math.round(Math.max(100,ips()*500)*(1+Math.min(ns,7)*.25));
function drawDaily(){if(S.lastDay===today)return;$("daily").hidden=false;$("dtitle").textContent=t("dT",ns);$("dtext").textContent=t("dX",fmt(rw()))}
$("claim").onclick=()=>{const r=rw();gain(r);S.streak=ns;S.lastDay=today;$("daily").hidden=true;toast(t("cT",fmt(r),ns));save()};

// Boss
let nextBoss=Date.now()+45000+Math.random()*60000,bossEnd=0;
function bossResolve(ok){bossEnd=0;$("boss").hidden=true;nextBoss=Date.now()+45000+Math.random()*75000;
 if(ok){const r=Math.round(Math.max(50,ips()*40+cpc()*20));gain(r);toast(t("bossOk",fmt(r)))}else{const l=Math.floor(S.wu*.05);S.wu-=l;toast(t("bossFail",fmt(l)))}}
$("bossb").onclick=()=>bossResolve(true);
addEventListener("keydown",e=>{if(e.code==="Space"&&bossEnd){e.preventDefault();bossResolve(true)}});

// Share
$("share").onclick=async()=>{const m=t("card",title(S.rank),fmt(S.total))+" "+location.href;try{await navigator.clipboard.writeText(m);toast(t("copied"))}catch(e){toast(m)}};

function render(){
 $("wu").textContent=fmt(S.wu);$("stats").textContent=t("stats",fmt(ips()),fmt(cpc()),mult().toFixed(1));
 $("rank").textContent=title(S.rank);$("need").textContent=t("need",fmt(need()));$("pbar").style.width=Math.min(100,S.run/need()*100)+"%";
 $("promo").textContent=t("promo",title(S.rank+1));$("promo").disabled=S.run<need();
 document.querySelectorAll("#shop button").forEach(b=>b.disabled=S.wu<cost(UP.find(u=>u.id===b.dataset.id)));
 if(bossEnd){const left=bossEnd-Date.now();$("bbar").style.width=Math.max(0,left/3500*100)+"%";if(left<=0)bossResolve(false)}
}
function applyLang(){document.documentElement.lang=lang;document.querySelectorAll("[data-i]").forEach(el=>el.textContent=L[lang][el.dataset.i]);
 $("l-en").classList.toggle("on",lang=="en");$("l-el").classList.toggle("on",lang=="el");$("l-en").setAttribute("aria-pressed",lang=="en");$("l-el").setAttribute("aria-pressed",lang=="el");
 fillInbox();shop();if(!$("daily").hidden)drawDaily();render()}
const setLang=l=>{lang=l;try{localStorage.setItem("looksbusy_lang",l)}catch(e){}applyLang()};
$("l-en").onclick=()=>setLang("en");$("l-el").onclick=()=>setLang("el");

let prev=performance.now(),n=0;
setInterval(()=>{const tm=performance.now();gain(ips()*(tm-prev)/1000);prev=tm;
 if(!bossEnd&&Date.now()>=nextBoss&&document.visibilityState==="visible"){bossEnd=Date.now()+3500;$("boss").hidden=false}
 render();if(++n%20==0)save()},250);
applyLang();drawDaily();if(awayGain>0)toast(t("away",fmt(awayGain)));
</script></body></html>
